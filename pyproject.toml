[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "custom_translations"
version = "1.1.0"
description = "Independent Simplified-Chinese translations for the Frappe ecosystem (frappe, erpnext, hrms, payments, wiki, helpdesk, webshop, telephony)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Custom Translations contributors" }]
classifiers = [
    "Framework :: Frappe",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/534627605/custom_translations"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["custom_translations*"]

[tool.setuptools.package-data]
custom_translations = [
    "translations/*.csv",
    "custom_translations/doctype/*/*.json",
    "custom_translations/doctype/*/*.py",
    "modules.txt",
    "patches.txt",
]
